[package]
name = "secondscrn-windows-host"
description = "Windows host platform for SecondScrn: virtual display, capture, GPU conversion, hardware encoding, input"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "secondscrn_host"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "secondscrn-host-cli"
path = "src/bin/cli.rs"

[dependencies]
secondscrn-protocol.workspace = true
secondscrn-security.workspace = true
secondscrn-session.workspace = true
secondscrn-transport.workspace = true
secondscrn-diagnostics.workspace = true
secondscrn-graphics.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
uniffi.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
secondscrn-session = { workspace = true, features = ["test-support"] }
tempfile = "3"
